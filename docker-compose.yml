services:
  oj-submission-wall:
    build: .
    container_name: oj-submission-wall
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      SYNC_MIN_AGE_SECONDS: ${SYNC_MIN_AGE_SECONDS:-120}
      SYNC_INCREMENTAL_OVERLAP_SECONDS: ${SYNC_INCREMENTAL_OVERLAP_SECONDS:-7200}
      FETCH_LOOKBACK_DAYS: ${FETCH_LOOKBACK_DAYS:-3650}
      FETCH_LIMIT: ${FETCH_LIMIT:-1000}
      CODEFORCES_VP_RANKS_PER_SYNC: ${CODEFORCES_VP_RANKS_PER_SYNC:-4}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-15}
      HTTP_RETRY_COUNT: ${HTTP_RETRY_COUNT:-2}
      HTTP_RETRY_BACKOFF_SECONDS: ${HTTP_RETRY_BACKOFF_SECONDS:-0.8}
      DISPLAY_TZ_OFFSET_HOURS: ${DISPLAY_TZ_OFFSET_HOURS:-8}
      CACHE_DIR: ${CACHE_DIR:-/data/cache}
      HISTORICAL_CACHE_AFTER_DAYS: ${HISTORICAL_CACHE_AFTER_DAYS:-30}
      HISTORICAL_CACHE_TTL_SECONDS: ${HISTORICAL_CACHE_TTL_SECONDS:-315360000}
      OVERVIEW_CACHE_TTL_SECONDS: ${OVERVIEW_CACHE_TTL_SECONDS:-20}
      OVERVIEW_FEED_LIMIT: ${OVERVIEW_FEED_LIMIT:-1000}
      BATTLE_MEMORY_CACHE_LIMIT: ${BATTLE_MEMORY_CACHE_LIMIT:-128}
      OJ_USER_AGENT: ${OJ_USER_AGENT:-OJSubmissionWall/1.0}
      LUOGU_USER_AGENT: ${LUOGU_USER_AGENT:-OJSubmissionWall/1.0}
      LUOGU_CF_CLEARANCE: ${LUOGU_CF_CLEARANCE:-}
      LUOGU_COOKIE: ${LUOGU_COOKIE:-}
      LUOGU_CSRF_TOKEN: ${LUOGU_CSRF_TOKEN:-}
      LUOGU_PROXY_URL: ${LUOGU_PROXY_URL:-}
      LUOGU_PROXY_TOKEN: ${LUOGU_PROXY_TOKEN:-}
      LUOGU_THIRD_PARTY_FALLBACK: ${LUOGU_THIRD_PARTY_FALLBACK:-true}
      LUOGU_FALLBACK_URLS: ${LUOGU_FALLBACK_URLS:-}
      LUOGU_RECORD_SYNC: ${LUOGU_RECORD_SYNC:-true}
      LUOGU_RECORD_RECENT_PAGES_PER_SYNC: ${LUOGU_RECORD_RECENT_PAGES_PER_SYNC:-10}
      LUOGU_RECORD_BACKFILL_PAGES_PER_SYNC: ${LUOGU_RECORD_BACKFILL_PAGES_PER_SYNC:-8}
      LUOGU_RECORD_SLEEP_MIN_SECONDS: ${LUOGU_RECORD_SLEEP_MIN_SECONDS:-0.4}
      LUOGU_RECORD_SLEEP_MAX_SECONDS: ${LUOGU_RECORD_SLEEP_MAX_SECONDS:-1.4}
      LUOGU_RECORD_INCREMENTAL_OVERLAP_SECONDS: ${LUOGU_RECORD_INCREMENTAL_OVERLAP_SECONDS:-7200}
      QOJ_COOKIE: ${QOJ_COOKIE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
