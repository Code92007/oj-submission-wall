services:
  oj-submission-wall:
    build: .
    container_name: oj-submission-wall
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./data:/data
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      DATA_DIR: /data
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-900}
      SYNC_MIN_AGE_SECONDS: ${SYNC_MIN_AGE_SECONDS:-120}
      FETCH_LOOKBACK_DAYS: ${FETCH_LOOKBACK_DAYS:-3650}
      FETCH_LIMIT: ${FETCH_LIMIT:-1000}
      CACHE_DIR: ${CACHE_DIR:-/data/cache}
      HISTORICAL_CACHE_AFTER_DAYS: ${HISTORICAL_CACHE_AFTER_DAYS:-30}
      HISTORICAL_CACHE_TTL_SECONDS: ${HISTORICAL_CACHE_TTL_SECONDS:-315360000}
      OJ_USER_AGENT: ${OJ_USER_AGENT:-OJSubmissionWall/1.0}
      QOJ_COOKIE: ${QOJ_COOKIE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
